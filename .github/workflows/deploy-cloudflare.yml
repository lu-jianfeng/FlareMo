name: Deploy FlareMo
on: workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装pnpm
        uses: pnpm/action-setup@v4

      - name: Node环境
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install

      - name: 创建全部需要的Vectorize索引
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl --request POST \
            --url "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/vectorize/v2/indexes" \
            --header "Authorization: Bearer ${CF_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"name":"flaremo-memos","dimensions":1024,"metric":"cosine"}'

          curl --request POST \
            --url "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/vectorize/v2/indexes" \
            --header "Authorization: Bearer ${CF_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"name":"flaremo-memories","dimensions":1024,"metric":"cosine"}'

          echo "等待20秒，Cloudflare后台同步"
          sleep 20

      - name: 打包构建
        run: pnpm -r build

      - name: 部署FlareMo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy
